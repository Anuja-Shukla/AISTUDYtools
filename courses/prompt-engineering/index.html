<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Engineering | AIStudyTools Courses</title>
<meta name="description" content="A free self-paced course on prompt engineering: how AI assistants work, writing clear prompts, examples and reasoning, prompt chains, real-world prompting and responsible use, with interactive prompt tools, a final test and a certificate.">
<link rel="canonical" href="https://www.aistudytools.com/courses/prompt-engineering/">
<meta name="theme-color" content="#4F46E5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAFF;--ink:#1E1B4B;--muted:#4A4878;--faint:#6E6C94;--accent:#4F46E5;--accent-dk:#3730A3;--soft:#EEF0FF;--line:#C9CCF7;--border:#E4E5F5;--sun:#FEF3C7;--sun-fg:#854D0E;--sun-strong:#FBBF24;--sky:#E0F2FE;--sky-fg:#075985;--pink:#FCE7F3;--pink-fg:#9D174D;--mint:#DCFCE7;--mint-fg:#166534;--red:#FEE2E2;--red-fg:#991B1B;--shadow:0 18px 40px -22px rgba(30,27,75,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Outfit',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.6}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.015em}
h1{font-size:clamp(34px,5vw,54px);font-weight:800}
h2{font-size:clamp(26px,3.4vw,36px);font-weight:800}
h3{font-size:21px;font-weight:700}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--sun-strong);outline-offset:2px}
/* top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(250,250,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:19px;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:50%;background:var(--accent);position:relative;flex:none}
.logo i::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--sun-strong);border:3px solid var(--bg)}
.tnav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tnav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
.tnav a:hover,.tnav a.on{background:var(--soft);color:var(--accent-dk)}
@media (max-width:760px){.top .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-direction:column;align-items:flex-start}.tnav{justify-content:flex-start}.tnav a{padding:6px 10px;font-size:14px}}
/* generic */
main{padding:32px 0 70px}
.card{background:#fff;border:2px solid var(--border);border-radius:20px;padding:24px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.grid>*{min-width:0}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--sun);color:var(--sun-fg);font-weight:700;font-size:13.5px}
.tag.indigo{background:var(--soft);color:var(--accent-dk)}.tag.mint{background:var(--mint);color:var(--mint-fg)}.tag.grey{background:#EEEEF3;color:#5B5B70}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;border:0;cursor:pointer;min-height:46px;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-ink{background:var(--ink);color:#fff}.btn-accent{background:var(--accent);color:#fff}.btn-soft{background:var(--soft);color:var(--accent-dk)}.btn-sun{background:var(--sun-strong);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-sm{padding:8px 14px;min-height:38px;font-size:14.5px;border-radius:12px}
.muted{color:var(--muted)}.small{font-size:14.5px}
.bar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:14px}
.note{background:var(--sun);color:var(--sun-fg);border-radius:14px;padding:14px 18px;font-size:15.5px}
.formula{background:var(--ink);color:#fff;border-radius:16px;padding:16px 20px;font-size:21px;font-weight:600;text-align:center;letter-spacing:.01em;overflow-x:auto}
.formula small{display:block;font-size:14px;color:#C9C8EA;font-weight:500;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:center}
th{background:var(--soft);color:var(--accent-dk);font-weight:700}
.tscroll{overflow-x:auto}
ul.clean{margin:0;padding-left:20px}ul.clean li{margin:4px 0}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center;margin-bottom:34px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero .lead{font-size:19px;color:var(--muted);margin-top:14px}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:conic-gradient(var(--accent) var(--p),var(--soft) 0)}
.ring span{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:28px;text-align:center;line-height:1.1}
.ring small{display:block;font-size:13px;color:var(--faint);font-weight:600}
/* module + lesson list */
.mod h3{margin:8px 0 4px}
.lessons{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.lessons a,.lessons span.lk{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:2px solid var(--border);text-decoration:none;color:var(--ink);font-weight:600;background:#fff}
.lessons a:hover{border-color:var(--line)}
.lessons span.lk{color:#9A99B8;background:#F6F6FA;cursor:not-allowed}
.st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;flex:none;background:var(--soft);color:var(--accent-dk)}
.st.done{background:#22C55E;color:#fff}.st.lock{background:#E7E7EE;color:#9A99B8}
.lessons em{margin-left:auto;font-style:normal;font-size:13.5px;color:var(--faint);font-weight:500;white-space:nowrap}
/* lesson */
.crumb{font-size:14.5px;color:var(--faint);margin-bottom:6px}
.lhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.sec{margin-top:26px}
.sec>h3{margin-bottom:10px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{font:inherit;font-weight:700;font-size:14.5px;border:2px solid var(--border);background:#fff;border-radius:12px;padding:7px 14px;cursor:pointer;color:var(--muted)}
.tabs button.on{border-color:var(--accent);color:var(--accent-dk);background:var(--soft)}
.vid{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:var(--ink)}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
/* walkthrough */
.wt{border-radius:20px;background:linear-gradient(160deg,#fff,#F3F3FF);border:2px solid var(--line);overflow:hidden}
.wt-stage{min-height:300px;padding:26px 24px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.wt-title{font-weight:800;font-size:22px}
.wt-cap{background:var(--ink);color:#fff;padding:12px 18px;font-weight:600;font-size:16.5px;text-align:center;min-height:52px}
.wt-ctl{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-top:1px solid var(--border)}
.wt-ctl button{font:inherit;border:0;background:var(--soft);color:var(--accent-dk);font-weight:800;border-radius:10px;padding:7px 12px;cursor:pointer;min-width:42px}
.dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--border)}.dots i.on{background:var(--accent)}
.fade{animation:fd .45s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-width:46px;padding:9px 12px;border-radius:12px;background:#fff;border:2px solid var(--border);font-weight:800;font-size:19px;text-align:center}
.chip.hl{background:var(--sun-strong);border-color:#E4A512;color:var(--ink)}
.chip.ac{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.dim{opacity:.4}
.chip.mi{background:var(--mint);border-color:#86EFAC;color:var(--mint-fg)}
.big{font-size:44px;font-weight:800;color:var(--accent)}
/* quiz */
.q{border:2px solid var(--border);border-radius:16px;padding:16px;background:#fff}
.q b{display:block;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:16px;border:2px solid var(--border);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--line)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.ok{border-color:#22C55E;background:var(--mint);color:var(--mint-fg)}
.opt.bad{border-color:#F87171;background:var(--red);color:var(--red-fg)}
.opt .k{font-weight:800;flex:none}
.expl{margin-top:10px;font-size:15px;background:var(--soft);border-radius:12px;padding:10px 14px;color:var(--accent-dk)}
/* calculator */
.calc input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--border);border-radius:14px;min-width:0}
.calc input:focus{border-color:var(--accent);outline:none}
.err{color:#B42318;font-weight:600;font-size:15px}
.res{display:grid;gap:12px;margin-top:12px}
.kv{display:flex;flex-wrap:wrap;gap:10px}
.kv span{background:var(--soft);color:var(--accent-dk);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15.5px}
/* boxplot */
.bp{width:100%;max-width:560px}
/* prompt boxes + tool fields */
.pbox{white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:14.5px;line-height:1.55;background:#fff;border:2px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:8px;width:100%;max-width:680px;color:var(--ink)}
.pbox.weak{border-color:#FCA5A5;background:#FFF5F5}
.pbox.good{border-color:#86EFAC;background:#F4FFF7}
.wt-stage .pbox{margin:0 auto}
.calc textarea,.calc select,.field textarea,.field select{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:2px solid var(--border);border-radius:14px;background:#fff;color:var(--ink);min-width:0}
.calc textarea{font-size:15px;resize:vertical}
.calc textarea:focus,.calc select:focus{border-color:var(--accent);outline:none}
.calc .field{margin-top:10px}
/* certificate preview */
.cert{background:#fff;border:10px double var(--accent);border-radius:8px;padding:34px 26px;text-align:center;max-width:820px;margin:0 auto}
.cert h2{font-size:clamp(24px,4vw,38px)}
.cert .nm{font-size:clamp(26px,4.5vw,42px);font-weight:800;color:var(--accent-dk);margin:10px 0;border-bottom:2px solid var(--line);display:inline-block;padding:0 16px 4px}
.field{display:grid;gap:6px}.field label{font-weight:700;font-size:15px}
.field input{font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--border);border-radius:14px;width:100%}
.gl-item{border:2px solid var(--border);background:#fff;border-radius:16px;padding:14px 16px}
.gl-item b{font-size:18px}
.footer{border-top:1px solid var(--border);padding:22px 0;color:var(--faint);font-size:14.5px}
@media print{.top,.footer,.noprint{display:none!important}body{background:#fff}main{padding:0}}
</style>
