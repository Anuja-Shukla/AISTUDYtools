<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Management Course | AIStudyTools</title>
<meta name="description" content="A free five-module Product Management course for MBA/PGDM students: discovery, strategy, prioritisation, delivery and growth, with slide decks, a RICE calculator, templates, a glossary, a quiz and cases.">
<link rel="canonical" href="https://www.aistudytools.com/courses/product-management/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky product-board top bar; content column of 1120px; module "roadmap track" as the home hero */
:root {
  --bg: #F6F8FA; --surface: #FFFFFF; --surface-2: #EEF3F6; --ink: #142033; --muted: #56657A; --line: #D9E1E8;
  --navy: #1B2A4A; --navy-ink: #FFFFFF; --teal: #0F7F81; --teal-soft: #DDF1F0; --orange: #C9661A; --orange-soft: #FDEBDA;
  --on-teal: #FFFFFF; --good: #1F7A4D; --good-soft: #E1F3EA; --bad: #B4352B; --bad-soft: #FBE5E2; --focus: #0F7F81;
  --shadow: 0 1px 2px rgba(20,32,51,.06), 0 4px 14px rgba(20,32,51,.06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1622; --surface: #172131; --surface-2: #1E2A3D; --ink: #E7EDF5; --muted: #A2B0C3; --line: #2C3A50;
  --navy: #22365E; --navy-ink: #FFFFFF; --teal: #4CC3C0; --teal-soft: #173B40; --orange: #F0A055; --orange-soft: #3A2A1A;
  --on-teal: #0B1A1F; --good: #5FD39A; --good-soft: #173A2A; --bad: #F2867B; --bad-soft: #3D1F1C; --focus: #4CC3C0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1622; --surface: #172131; --surface-2: #1E2A3D; --ink: #E7EDF5; --muted: #A2B0C3; --line: #2C3A50;
  --navy: #22365E; --navy-ink: #FFFFFF; --teal: #4CC3C0; --teal-soft: #173B40; --orange: #F0A055; --orange-soft: #3A2A1A;
  --on-teal: #0B1A1F; --good: #5FD39A; --good-soft: #173A2A; --bad: #F2867B; --bad-soft: #3D1F1C; --focus: #4CC3C0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 17px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy) }
a { color: var(--teal) }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0 }
h1 { font-size: clamp(2rem, 4.6vw, 3.1rem); font-weight: 800; letter-spacing: -.01em }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700 }
h3 { font-size: 1.22rem; font-weight: 700 }
p { margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px }
.eyebrow { font: 600 .78rem/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--teal) }
.muted { color: var(--muted) }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: var(--navy-ink) }
.topbar .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; padding-block: 6px }
.brand { display: flex; align-items: center; gap: 10px; color: var(--navy-ink); text-decoration: none; font: 800 1.12rem/1 var(--f-display); white-space: nowrap }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: #0F8B8D; display: grid; place-items: center; font: 800 .8rem/1 var(--f-mono); color: #fff }
.nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap }
.nav a { color: #D6DEEA; text-decoration: none; padding: 8px 11px; border-radius: 8px; font-weight: 600; font-size: .95rem }
.nav a:hover { background: rgba(255,255,255,.08); color: #fff }
.nav a[aria-current="page"] { background: rgba(255,255,255,.14); color: #fff }
.menu-btn { display: none; margin-left: auto; background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 8px; padding: 6px 12px; font-weight: 600; cursor: pointer }
@media (max-width: 960px) {
  .menu-btn { display: block }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; background: var(--navy); flex-direction: column; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)) }
  .nav.open { display: flex }
}

main { padding-block: 32px 72px }
.page { display: grid; gap: 32px }
.section { display: grid; gap: 16px }
.lede { font-size: 1.15rem; max-width: 66ch; color: var(--muted) }
.prose { max-width: 70ch; display: grid; gap: 10px }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0 }
.panel.tint { background: var(--surface-2); border-color: transparent }
ul.clean { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px }
ul.ticks { margin: 0; padding-left: 1.2em; display: grid; gap: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); font-weight: 600; font-size: .88rem; text-decoration: none; border: 0; cursor: pointer }
.chip.orange { background: var(--orange-soft); color: var(--orange) }
.chip.plain { background: var(--surface-2); color: var(--ink) }
.tag { font: 600 .74rem/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted) }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--navy); background: var(--navy); color: var(--navy-ink); font-weight: 700; cursor: pointer; text-decoration: none; font-size: .96rem }
.btn:hover { filter: brightness(1.12) }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line) }
.btn.ghost:hover { background: var(--surface-2) }
.btn.teal { background: var(--teal); border-color: var(--teal); color: var(--on-teal) }
.btn.small { padding: 6px 11px; font-size: .88rem }
.btn[disabled] { opacity: .5; cursor: not-allowed }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.note { font-size: .92rem; color: var(--muted) }
.callout { border-left: 4px solid var(--teal); background: var(--surface-2); padding: 14px 16px; border-radius: 0 var(--r) var(--r) 0; display: grid; gap: 6px }
.callout.orange { border-color: var(--orange) }

/* home: hero + roadmap track */
.hero { display: grid; gap: 18px; padding-block: 8px 4px }
.hero h1 span { color: var(--teal) }
.progress { display: grid; gap: 8px; max-width: 560px }
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line) }
.bar > i { display: block; height: 100%; background: var(--teal); border-radius: 99px; transition: width .4s }
.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; position: relative }
.track::before { content: ""; position: absolute; left: 4%; right: 4%; top: 22px; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px) }
@media (max-width: 900px) { .track { grid-template-columns: 1fr } .track::before { display: none } }
.mod-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; text-decoration: none; color: inherit; box-shadow: var(--shadow); transition: transform .15s, border-color .15s }
.mod-card:hover { transform: translateY(-2px); border-color: var(--teal) }
.mod-num { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 800 1.05rem/1 var(--f-display); background: var(--navy); color: var(--navy-ink); border: 3px solid var(--bg) }
.mod-card.done .mod-num { background: var(--teal) }
.mod-card h3 { font-size: 1.08rem }
.mod-card ul { margin: 0; padding-left: 1.1em; font-size: .9rem; color: var(--muted); display: grid; gap: 4px }
.stage { font: 600 .72rem/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--orange) }
.challenge { background: var(--navy); color: var(--navy-ink); border-radius: var(--r); padding: 24px; display: grid; gap: 12px }
.challenge .eyebrow { color: #9FE3DF }
.challenge p { color: #DCE4EE }
.challenge .btn { background: #0F8B8D; border-color: #0F8B8D; color: #fff; width: max-content }
.challenge .reveal { background: rgba(255,255,255,.08); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px }
.quick a { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-decoration: none; color: var(--ink); display: grid; gap: 4px }
.quick a strong { font-family: var(--f-display) }
.quick a span { font-size: .9rem; color: var(--muted) }
.quick a:hover { border-color: var(--teal) }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: .95rem }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
th { background: var(--surface-2); font-weight: 700; white-space: nowrap }
tr:last-child td { border-bottom: 0 }
.num { font-variant-numeric: tabular-nums; text-align: right }

/* module page */
.mod-head { display: grid; gap: 12px }
.mod-nav { display: flex; gap: 8px; flex-wrap: wrap }
.mod-nav a { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 600; font-size: .9rem; background: var(--surface) }
.mod-nav a[aria-current="page"] { background: var(--navy); color: var(--navy-ink); border-color: var(--navy) }
.topic { display: grid; gap: 8px; padding-block: 14px; border-top: 1px solid var(--line) }
.topic:first-child { border-top: 0; padding-top: 0 }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr } }
.side { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px) }
@media (max-width: 900px) { .side { position: static } }
ol.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 6px }

/* knowledge check + quiz */
.q { display: grid; gap: 12px }
.opts { display: grid; gap: 8px }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.4 }
.opt:hover:not([disabled]) { border-color: var(--teal) }
.opt .key { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 .8rem/1 var(--f-mono); background: var(--surface-2) }
.opt.sel { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy) }
.opt.right { border-color: var(--good); background: var(--good-soft) }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft) }
.opt[disabled] { cursor: default }
.feedback { border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px }
.feedback.ok { background: var(--good-soft) } .feedback.no { background: var(--bad-soft) }
.feedback b { font-family: var(--f-display) }
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.dots { display: flex; gap: 5px; flex-wrap: wrap }
.dots button { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font: 600 .7rem/1 var(--f-mono); cursor: pointer; padding: 0 }
.dots button.cur { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy) }
.dots button.ans { background: var(--teal-soft) }
.score-big { font: 800 3.4rem/1 var(--f-display); color: var(--teal); font-variant-numeric: tabular-nums }

/* glossary */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.field { display: grid; gap: 4px; min-width: 0 }
.field label { font-weight: 600; font-size: .88rem; color: var(--muted) }
input[type="search"], input[type="text"], input[type="number"], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-width: 0 }
input[type="search"] { width: min(420px, 100%) }
.az { display: flex; flex-wrap: wrap; gap: 4px }
.az button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font: 600 .82rem/1 var(--f-mono); cursor: pointer; padding: 0 }
.az button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); border-color: var(--navy) }
.az button:disabled { opacity: .35; cursor: default }
.term { display: grid; gap: 6px; scroll-margin-top: 90px }
.term h3 { font-size: 1.1rem }
.term .ex { font-size: .93rem; color: var(--muted) }
.term.flash { animation: flash 1.6s ease-out }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--teal) } to { box-shadow: 0 0 0 0 transparent } }
.empty { text-align: center; padding: 32px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r) }

/* templates + code */
pre.tpl { font: 400 .86rem/1.55 var(--f-mono); background: var(--surface-2); border-radius: 8px; padding: 14px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow: auto }
details.tpl-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); scroll-margin-top: 90px }
details.tpl-card > summary { cursor: pointer; padding: 14px 18px; display: flex; gap: 10px; align-items: center; justify-content: space-between; list-style: none }
details.tpl-card > summary::-webkit-details-marker { display: none }
details.tpl-card > summary::after { content: "+"; font: 600 1.3rem/1 var(--f-mono); color: var(--muted) }
details.tpl-card[open] > summary::after { content: "–" }
.tpl-body { padding: 0 18px 18px; display: grid; gap: 12px }
.copy-ok { color: var(--good); font-weight: 600; font-size: .9rem }

/* RICE */
.rice-table input { width: 100%; min-width: 70px; padding: 6px 8px }
.rice-table td:nth-child(2) input { min-width: 220px }
.rice-table tr.top td { background: var(--teal-soft) }
.rank { font: 700 .85rem/1 var(--f-mono); color: var(--muted) }
.rice-score { font: 700 1rem/1 var(--f-mono) }
.err { color: var(--bad); font-size: .85rem }

/* slides viewer */
.deck-list { display: grid; gap: 12px }
.deck-row { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap }
.viewer { display: grid; gap: 12px }
.slide { aspect-ratio: 16 / 9; max-width: 100%; background: #FFFFFF; color: #1F2937; border-radius: 8px; border: 1px solid var(--line); position: relative; overflow: hidden; container-type: inline-size; box-shadow: var(--shadow) }
.slide .sbar { position: absolute; left: 0; top: 0; bottom: 0; width: 1.35%; background: #0F8B8D }
.slide .st { position: absolute; left: 4.5%; top: 5%; right: 4.5%; font: 700 4.1cqw/1.15 var(--f-display); color: #1B2A4A }
.slide .sline { position: absolute; left: 4.5%; top: 17.3%; width: 10.5%; height: .5cqw; background: #E07A1F }
.slide .sbody { position: absolute; left: 6%; right: 6%; top: 21.5%; bottom: 9%; font-size: 2.15cqw; line-height: 1.45; display: flex; flex-direction: column; gap: 1.4cqw }
.slide .sfoot { position: absolute; left: 4.5%; right: 4.5%; bottom: 3%; display: flex; justify-content: space-between; font-size: 1.15cqw; color: #6B7280 }
.slide ul { margin: 0; padding-left: 1.2em; display: grid; gap: .9cqw }
.slide ol { margin: 0; padding-left: 1.3em; display: grid; gap: .9cqw }
.slide.cover { background: #1B2A4A; color: #fff }
.slide.cover .k { position: absolute; left: 6.7%; top: 21%; font: 700 1.8cqw/1 var(--f-body); color: #9FE3DF }
.slide.cover .t { position: absolute; left: 6.7%; top: 29%; right: 8%; font: 800 5.6cqw/1.1 var(--f-display) }
.slide.cover .tg { position: absolute; left: 6.7%; top: 60%; right: 10%; font-size: 2.2cqw; color: #D7DEE8 }
.slide.cover .stripe { position: absolute; left: 0; right: 0; top: 78.7%; height: 1.6%; background: #0F8B8D }
.s-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw; height: 100% }
.s-cols > div { background: #F3F6F9; border: 1px solid #DDE3EA }
.s-cols h4 { margin: 0; padding: 1cqw 1.6cqw; color: #fff; font: 700 2cqw/1.3 var(--f-display) }
.s-cols ul { padding: 1.4cqw 1.6cqw 1.4cqw 3.4cqw }
.s-table { width: 100%; border-collapse: collapse; font-size: 1.75cqw }
.s-table th { background: #1B2A4A; color: #fff; padding: .9cqw 1.2cqw; white-space: normal }
.s-table td { padding: .9cqw 1.2cqw; border: 1px solid #DDE3EA }
.s-table tr:nth-child(even) td { background: #F3F6F9 }
.s-steps { display: flex; gap: 1.6cqw; align-items: stretch; margin-top: 4cqw; height: 40% }
.s-steps > div { flex: 1; border: 1.5px solid #0F8B8D; border-radius: 1.2cqw; background: #F3F6F9; display: grid; align-content: center; justify-items: center; text-align: center; padding: 1.4cqw; position: relative }
.s-steps > div:nth-child(even) { background: #DDF1F0 }
.s-steps b { font: 700 2cqw/1.2 var(--f-display); color: #1B2A4A }
.s-steps span { font-size: 1.6cqw }
.s-steps i { position: absolute; top: -2.2cqw; width: 4.4cqw; height: 4.4cqw; border-radius: 50%; background: #E07A1F; color: #fff; font: 700 1.6cqw/4.4cqw var(--f-body); font-style: normal; border: .3cqw solid #fff }
.s-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 1cqw; height: 100%; padding: 0 6% }
.s-matrix > div { padding: 1.6cqw 2cqw; border: 1px solid #CBD5E1; display: grid; align-content: start; gap: .6cqw }
.s-matrix b { font: 700 2.1cqw/1.2 var(--f-display); color: #1B2A4A }
.s-matrix span { font-size: 1.7cqw }
.s-funnel { display: grid; gap: .7cqw }
.s-funnel > div { display: grid; grid-template-columns: 58% 1fr; gap: 2.4cqw; align-items: center }
.s-funnel b { display: block; color: #fff; text-align: center; padding: 1.3cqw 0; font: 700 1.9cqw/1 var(--f-display); margin: 0 auto }
.s-funnel span { font-size: 1.7cqw }
.s-tree { display: grid; gap: 3cqw; justify-items: center; text-align: center }
.s-tree .r { background: #1B2A4A; color: #fff; padding: 1.2cqw 3cqw; border-radius: 1cqw; font: 700 1.8cqw/1.2 var(--f-display) }
.s-tree .row { display: flex; gap: 3cqw; justify-content: center; width: 100% }
.s-tree .m { background: #DDF1F0; border: 1px solid #0F8B8D; padding: 1cqw 2cqw; border-radius: 1cqw; font-weight: 700; color: #1B2A4A; font-size: 1.7cqw; flex: 1 }
.s-tree .l { background: #FFF1E3; border: 1px solid #E07A1F; padding: .9cqw 1.4cqw; border-radius: 1cqw; font-size: 1.55cqw; flex: 1 }
.s-curve { display: grid; grid-template-columns: 1.9fr 1fr; gap: 2.4cqw; height: 100% }
.s-curve svg { width: 100%; height: 100% }
.s-curve .tips { display: grid; gap: .9cqw; align-content: start }
.s-curve .tips div { background: #F3F6F9; border: 1px solid #DDE3EA; padding: .9cqw 1.4cqw; font-size: 1.5cqw; line-height: 1.3 }
.s-curve .tips b { display: block; color: #1B2A4A; font-size: 1.75cqw }
.s-venn { position: relative; height: 100% }
.s-venn .c { position: absolute; width: 26%; aspect-ratio: 1; border-radius: 50%; border: .3cqw solid }

MODULES.push({
  id: 1,
  title: "Foundations of Product Management",
  short: "Foundations",
  tagline: "What products are, what product managers do, and how they think.",
  overview: "This module introduces product management as a discipline that sits between customers, business, and technology. You will learn what separates a product from a project, what a product manager is accountable for, and the habit of mind that good PMs share: start from a customer problem and measure success by outcomes, not by the number of features shipped.",
  outcomes: [
    "Distinguish product management from project and program management using a concrete example.",
    "Describe the core responsibilities and competencies of a product manager across a product's life.",
    "Explain how a PM collaborates with engineering, design, marketing, sales, and leadership.",
    "Apply product thinking to reframe a feature request as a customer problem with a measurable outcome.",
    "Classify products as B2C, B2B/SaaS, platform, or physical, and explain how the PM role changes across them.",
    "Map the product life cycle to typical PM priorities at each stage."
  ],
  concepts: ["Product vs project", "Outcome over output", "Four product risks", "Product life cycle", "Cross-functional team", "Product thinking"],
  topics: [
    { h: "What is a product?", body: "A product is anything offered to customers that solves a problem or meets a need repeatedly over time: a mobile app, a SaaS tool, a bank account, a packaged food item, or a service plan. What makes it a product rather than a one-off deliverable is that it has users, it evolves, and it must keep earning its place against alternatives.", points: ["A project has a fixed scope and end date; a product has a life cycle with no planned end.", "Program management coordinates several related projects; product management decides what is worth building and why.", "The same team can run projects inside a product, for example a two-month project to launch a new payment option."] },
    { h: "The role of the product manager", body: "A product manager is accountable for the value a product creates for customers and for the business. PMs usually have no direct authority over engineers or designers, so they lead through clarity: a well-understood problem, evidence, and a shared definition of success.", points: ["Discover: understand users, problems, and the market.", "Decide: set strategy, prioritise, and say no.", "Deliver: work with design and engineering to ship and learn.", "Measure: track outcomes and decide what to do next."] },
    { h: "Working with the cross-functional team", body: "The core product trio is product, design, and engineering. Around it sit marketing (positioning and launch), sales and customer success (customer feedback and adoption), data/analytics, legal and compliance, and leadership. A PM's week mixes customer conversations, reviewing designs, refining the backlog, reading metrics, and aligning stakeholders.", points: ["Engineering owns how to build; the PM owns why and what problem to solve.", "Design owns the experience; the PM ensures it solves the right problem.", "Marketing and sales need early involvement, not a hand-off on launch day."] },
    { h: "Product thinking: outcomes over outputs", body: "An output is something the team ships, such as a new filter screen. An outcome is a change in customer behaviour or business results, such as more users finding a product within two minutes. Product thinking starts from the problem and the outcome, then treats features as bets that may or may not move it.", points: ["Ask 'what problem, for whom, and how will we know it is solved?' before 'what should we build?'", "Marty Cagan's four product risks: value (will they want it?), usability (can they use it?), feasibility (can we build it?), viability (does it work for the business?)."] },
    { h: "Types of products", body: "The PM role changes with the business model. B2C products need scale, simplicity, and habit formation. B2B and SaaS products serve buyers and users who may be different people, with longer sales cycles. Platforms and marketplaces must balance two or more sides, such as buyers and sellers. Physical products add manufacturing, supply chain, and longer iteration cycles.", points: ["B2C example: a food-delivery or payments app used daily by consumers.", "B2B/SaaS example: payroll or CRM software sold to companies.", "Marketplace example: a platform matching sellers and buyers.", "Physical example: a home appliance with a connected app."] },
    { h: "Product life cycle and careers", body: "Products move through introduction, growth, maturity, and decline. Early on, the PM focuses on discovery and product–market fit; in growth, on scaling and onboarding; in maturity, on efficiency, retention, and new segments; in decline, on harvesting or sunsetting. Typical career steps run from Associate PM to PM, Senior PM, Group PM, and Director or VP of Product.", points: ["Introduction: find fit. Growth: scale. Maturity: defend and extend. Decline: harvest or retire.", "Many MBA graduates enter through APM programmes or move from consulting, analytics, or marketing roles."] }
  ],
  example: { title: "Industry application: UPI payment apps", body: "When India's Unified Payments Interface (UPI) made instant bank-to-bank transfers possible, several consumer apps competed to make small, everyday payments effortless. The product problem was not 'build a payments screen' but 'make paying a neighbourhood shop as quick as handing over cash'. Features such as QR-code scanning and simple payment confirmation were outputs; the outcome teams cared about was repeated everyday use. (Illustrative analysis based on public product features.)" },
  miniCase: { title: "Mini-case: the dashboard request", context: "A sales director at a B2B software company asks the PM to 'add an export-to-Excel button on every report'. Three large clients have asked for it.", question: "Before agreeing, what questions would you ask to uncover the underlying problem? What outcome would tell you the problem is solved?" },
  activity: { title: "Activity: product teardown", steps: ["Pick a familiar app (for example, a payments, food-delivery, or travel app).", "Write the main customer problem it solves in one sentence.", "Identify two user types and what each is trying to get done.", "List three features and, for each, the outcome it is meant to drive.", "Name one of Cagan's four risks the product appears to manage well."], deliverable: "A one-page teardown shared in class." },
  check: [
    { q: "Which statement best describes an outcome rather than an output?", o: ["Launched a new search filter", "Reduced the time for users to find a product from 4 to 2 minutes", "Completed 12 user stories this sprint", "Redesigned the checkout screen"], a: 1, why: "An outcome is a change in user behaviour or results. The others describe things the team shipped." },
    { q: "Who typically owns the decision on how a feature is technically built?", o: ["The product manager", "Engineering", "Sales", "Marketing"], a: 1, why: "Engineering owns the 'how'. The PM owns the problem and the 'why'." },
    { q: "Which of these is a viability risk?", o: ["Users cannot find the button", "The team lacks the skills to build it", "The feature costs more to serve than it earns", "Users do not want the feature"], a: 2, why: "Viability asks whether the solution works for the business, including cost and revenue." }
  ],
  glossary: ["Product manager", "Product thinking", "Outcome vs output", "Cross-functional team", "Product life cycle", "Four product risks"],
  templates: ["problem"],
  slides: [
    { k: "title", t: "Foundations of Product Management", s: "Module 1 · Product Management", n: "Welcome students. This module sets up the vocabulary and mindset for the whole course." },
    { k: "bullets", t: "Learning objectives", b: ["Distinguish products, projects, and programs", "Describe what a product manager is accountable for", "Explain how PMs work with cross-functional teams", "Reframe features as problems and outcomes", "Relate the product life cycle to PM priorities"], n: "Read the objectives aloud and ask which one students find least clear today." },
    { k: "two", t: "Product vs project", l: { h: "Project", i: ["Fixed scope and deadline", "Success = on time, on budget", "Team disbands at the end"] }, r: { h: "Product", i: ["Evolves with no planned end", "Success = customer and business outcomes", "Long-lived team that keeps learning"] }, n: "Use a campus example: building a new library is a project; the library service is a product." },
    { k: "venn", t: "Where the PM sits", c: ["Business", "Technology", "User experience"], centre: "PM", n: "Martin Eriksson's well-known Venn diagram: the PM works at the intersection of business, technology, and user experience." },
    { k: "steps", t: "What a PM does", st: [["Discover", "Users, problems, market"], ["Decide", "Strategy, priorities, trade-offs"], ["Deliver", "Ship with design and engineering"], ["Measure", "Outcomes, learning, next bet"]], n: "Stress that this is a loop, not a line." },
    { k: "two", t: "Outputs vs outcomes", l: { h: "Output (what we ship)", i: ["A new filter screen", "A loyalty-points feature", "An onboarding video"] }, r: { h: "Outcome (what changes)", i: ["Users find items in 2 minutes, not 4", "Repeat orders rise in month 2", "More new users complete setup"] }, n: "Ask students to convert one of their own project deliverables into an outcome." },
    { k: "matrix", t: "The four product risks", q: [["Value", "Will customers want it?"], ["Usability", "Can they figure out how to use it?"], ["Feasibility", "Can we build it with our time, skills, and tech?"], ["Viability", "Does it work for the business: cost, legal, brand?"]], n: "From Marty Cagan, 'Inspired'. Good teams test these risks before building, not after." },
    { k: "table", t: "Types of products", h: ["Type", "Example", "PM focus"], rows: [["B2C", "Payments or food-delivery app", "Scale, simplicity, habit"], ["B2B / SaaS", "Payroll or CRM software", "Buyer vs user, sales cycle"], ["Marketplace", "Buyer–seller platform", "Balance both sides"], ["Physical", "Connected appliance", "Supply chain, slower iteration"]], n: "Ask which type students would most like to manage, and why." },
    { k: "curve", t: "Product life cycle", labels: ["Introduction", "Growth", "Maturity", "Decline"], tips: ["Find fit", "Scale", "Defend and extend", "Harvest or retire"], n: "Map well-known products to each stage. Avoid quoting figures you have not verified." },
    { k: "activity", t: "Activity: product teardown", b: ["Pick a familiar app", "State its core customer problem in one sentence", "Name two user types and their goals", "Link three features to outcomes", "Identify one product risk it manages well"], n: "Give 15 minutes in pairs, then take three quick share-outs." },
    { k: "recap", t: "Recap", b: ["Products evolve; projects end", "PMs own the why and the what, not the how", "Measure outcomes, not outputs", "Test value, usability, feasibility, viability early", "Priorities shift across the life cycle"], n: "Summarise in under two minutes." },
    { k: "questions", t: "Discussion questions", b: ["Can a PM succeed without authority? How?", "When might shipping more features hurt a product?", "How would the PM role differ in a bank versus a start-up?"], n: "Use for the closing discussion or as a short written reflection." }
  ]
});

MODULES.push({
  id: 2,
  title: "Product Discovery and Customer Insight",
  short: "Discovery",
  tagline: "Find problems worth solving before building solutions.",
  overview: "Discovery is the work of understanding customers and testing ideas before committing engineering time. This module covers how to frame problems, run user research, use Jobs-to-be-Done, build personas and journey maps, size a market, analyse competitors, and validate ideas cheaply with experiments.",
  outcomes: [
    "Write a clear problem statement that names the user, the need, and the evidence.",
    "Select an appropriate research method (interview, survey, observation, usability test, analytics) for a given question.",
    "Express customer needs as Jobs-to-be-Done statements and build a customer journey map.",
    "Estimate a market using TAM, SAM, and SOM with a bottom-up calculation.",
    "Design a low-cost validation test such as a fake-door or concierge MVP."
  ],
  concepts: ["Problem statement", "Jobs-to-be-Done", "Persona", "Journey map", "Opportunity solution tree", "TAM/SAM/SOM", "Validation experiments"],
  topics: [
    { h: "Problem discovery and problem statements", body: "A good problem statement describes who is struggling, with what, in what situation, and how we know. It avoids naming a solution. Weak: 'We need a chatbot.' Strong: 'First-time buyers on our app abandon checkout when delivery dates are unclear; 38 of 50 support tickets last month asked about delivery timing.' (Numbers illustrative.)", points: ["Name the user and situation.", "Describe the struggle, not the feature.", "State the evidence and its source."] },
    { h: "User research methods", body: "Choose the method that fits the question. Interviews explore why people behave as they do. Surveys measure how common something is. Observation and contextual inquiry reveal what people actually do. Usability tests check whether people can use a design. Product analytics show what users do at scale but rarely why.", points: ["Interviews: 5–8 conversations often surface the main themes.", "Ask about past behaviour ('tell me about the last time…'), not hypothetical futures.", "Avoid leading questions such as 'Would you use a feature that…?'"] },
    { h: "Jobs-to-be-Done", body: "Jobs-to-be-Done (JTBD), associated with Clayton Christensen, says customers 'hire' a product to make progress in a particular situation. A JTBD statement takes the form: When [situation], I want to [motivation], so I can [expected outcome]. Thinking in jobs widens the view of competition: a learning app competes with YouTube, tutors, and friends.", points: ["Functional, emotional, and social dimensions of a job.", "Example: When I'm commuting, I want to learn something useful in 10 minutes, so I can feel I'm progressing in my career."] },
    { h: "Personas, empathy maps, and journey maps", body: "Personas summarise research into a few archetypal users with goals, behaviours, and pain points; they should be built from real data, not imagination. Empathy maps capture what users say, think, do, and feel. Journey maps follow a user through stages (aware, consider, sign up, use, return) and mark pain points and opportunities at each stage.", points: ["One persona per distinct goal, not per demographic.", "Mark the highest-emotion moments on a journey map; they are often the best opportunities."] },
    { h: "Opportunity solution trees", body: "Teresa Torres's opportunity solution tree links a desired outcome to the customer opportunities (needs, pains, desires) that could drive it, then to candidate solutions, then to small experiments that test them. It keeps teams from jumping from an outcome straight to one favourite feature.", points: ["Outcome → opportunities → solutions → experiments.", "Compare several solutions per opportunity before choosing."] },
    { h: "Market sizing and competition", body: "TAM (total addressable market) is the total demand for the category; SAM (serviceable available market) is the part your product and channels can reach; SOM (serviceable obtainable market) is the share you can realistically win soon. Bottom-up sizing multiplies the number of target customers by what each would pay, and is usually more credible than top-down figures from reports.", points: ["Bottom-up example: 2,00,000 kirana stores × ₹6,000 per year = ₹120 crore SAM (illustrative).", "Competitive analysis compares alternatives on the jobs customers care about, including non-obvious substitutes."] },
    { h: "Validating ideas cheaply", body: "Before building, test whether people want something. A fake-door test shows a button or offer for a feature that does not yet exist and measures clicks. A landing page tests interest and willingness to sign up. A concierge MVP delivers the service manually to a few users. A Wizard-of-Oz MVP looks automated to users but is run by people behind the scenes.", points: ["Define the success threshold before running the test.", "Be transparent with users after a fake-door test; respect their time and trust."] }
  ],
  example: { title: "Industry application: discount broking", body: "Zerodha is widely credited with popularising discount broking in India by focusing on a clear customer problem: active retail investors found traditional brokerage fees high and platforms cluttered. A JTBD lens frames the job as 'When I want to trade or invest, I want low, predictable costs and a fast, simple platform, so I can manage my own money confidently.' (Qualitative illustration; no performance figures implied.)" },
  miniCase: { title: "Mini-case: the abandoned sign-up", context: "A health-and-fitness start-up sees that many visitors begin sign-up but few finish. The founder wants to add social login immediately.", question: "Design a discovery plan: which two research methods would you use first, what would you ask, and what evidence would justify building social login?" },
  activity: { title: "Activity: interview and synthesise", steps: ["Choose an everyday problem area (for example, booking a doctor's appointment).", "Interview three people about the last time they faced it.", "Capture quotes, pains, and workarounds on sticky notes.", "Cluster findings and write one JTBD statement.", "Sketch a five-stage journey map with the biggest pain marked."], deliverable: "A JTBD statement, a journey map, and a bottom-up market estimate." },
  check: [
    { q: "Which interview question is least biased?", o: ["Would you use an app that reminds you to drink water?", "Don't you find it hard to stay hydrated?", "Tell me about the last time you tried to change a daily habit.", "How much would you pay for our hydration app?"], a: 2, why: "Asking about real past behaviour avoids leading the user or asking them to predict the future." },
    { q: "SOM represents:", o: ["The total demand for the whole category", "The part of the market your channels can serve", "The share you can realistically capture in the near term", "Your competitor's market share"], a: 2, why: "SOM is the serviceable obtainable market: what you can realistically win soon." },
    { q: "A Wizard-of-Oz MVP is best described as:", o: ["A product built with no-code tools", "A service that looks automated but is run manually behind the scenes", "A fake button that measures clicks", "A beta released only to employees"], a: 1, why: "In a Wizard-of-Oz test, users see an automated experience while people do the work manually." }
  ],
  glossary: ["Jobs-to-be-Done", "Persona", "Customer journey map", "Opportunity solution tree", "TAM / SAM / SOM", "Fake-door test", "Concierge MVP", "Usability testing"],
  templates: ["interview", "persona", "jtbd", "lean"],
  slides: [
    { k: "title", t: "Product Discovery and Customer Insight", s: "Module 2 · Product Management", n: "Discovery reduces the risk of building the wrong thing." },
    { k: "bullets", t: "Learning objectives", b: ["Write problem statements without naming solutions", "Choose the right research method", "Use Jobs-to-be-Done, personas, and journey maps", "Size a market bottom-up", "Design cheap validation tests"], n: "Link back to the four risks from Module 1: discovery mostly tests value and usability." },
    { k: "two", t: "Weak vs strong problem statements", l: { h: "Weak", i: ["We need a chatbot", "Users want more features", "Build a loyalty programme"] }, r: { h: "Strong", i: ["First-time buyers abandon checkout when delivery dates are unclear", "Evidence: support tickets and session recordings", "No solution named yet"] }, n: "Have students rewrite a weak statement live." },
    { k: "table", t: "Choosing a research method", h: ["Question", "Method", "Gives you"], rows: [["Why do people do this?", "Interviews", "Motivations, context"], ["How common is it?", "Survey", "Frequency, scale"], ["What do they actually do?", "Observation", "Real behaviour"], ["Can they use it?", "Usability test", "Friction points"], ["What happens at scale?", "Analytics", "Patterns, not reasons"]], n: "Combine qualitative 'why' with quantitative 'how many'." },
    { k: "bullets", t: "Jobs-to-be-Done", b: ["Customers 'hire' products to make progress", "When [situation], I want to [motivation], so I can [outcome]", "Jobs have functional, emotional, and social sides", "Competition = every way the job gets done today"], n: "Christensen's milkshake story is a useful hook if students have not heard it." },
    { k: "steps", t: "Customer journey map", st: [["Aware", "Hears about it"], ["Consider", "Compares options"], ["Sign up", "First use"], ["Use", "Gets value?"], ["Return", "Habit or churn"]], n: "Mark pains and emotions at each stage; the lowest points are opportunities." },
    { k: "tree", t: "Opportunity solution tree", root: "Outcome: more repeat orders", mid: ["Hard to reorder favourites", "Unsure of delivery time"], leaf: ["One-tap reorder", "Saved baskets", "Live ETA", "Delivery slots"], n: "Teresa Torres, 'Continuous Discovery Habits'. Compare several solutions per opportunity." },
    { k: "funnel", t: "TAM, SAM, SOM", lv: [["TAM", "All small retail stores needing inventory software"], ["SAM", "Stores in cities we serve with smartphones"], ["SOM", "Stores we can win in 2 years"]], n: "Walk through the bottom-up calculation: customers × price." },
    { k: "table", t: "Cheap validation tests", h: ["Test", "What it checks", "Watch out"], rows: [["Fake door", "Interest in a feature", "Explain honestly after"], ["Landing page", "Demand and sign-ups", "Traffic quality"], ["Concierge MVP", "Value of the service", "Doesn't test scale"], ["Wizard of Oz", "Experience before automation", "Cost of manual effort"]], n: "Always set the success threshold before running the test." },
    { k: "activity", t: "Activity: interview and synthesise", b: ["Interview three people about a real recent experience", "Capture quotes, pains, workarounds", "Cluster into themes", "Write one JTBD statement", "Sketch a journey map with the biggest pain"], n: "Pairs work well: one asks, one takes notes." },
    { k: "recap", t: "Recap", b: ["Start from problems, not solutions", "Ask about past behaviour, not hypotheticals", "Jobs reveal true competition", "Size markets bottom-up", "Validate before you build"], n: "" },
    { k: "questions", t: "Discussion questions", b: ["When is a survey misleading?", "Is a fake-door test ethical? Under what conditions?", "What would you do if research contradicts the CEO's idea?"], n: "" }
  ]
});

MODULES.push({
  id: 3,
  title: "Product Strategy, Vision, and Prioritisation",
  short: "Strategy",
  tagline: "Decide where to go, what matters most, and what to leave out.",
  overview: "Strategy turns discovery into direction. This module covers product vision and strategy, how to recognise product–market fit, choosing a North Star metric, setting OKRs, prioritising with RICE, MoSCoW, Kano, and value-versus-effort, building outcome-based roadmaps, managing stakeholders, and deciding whether to build, buy, or partner.",
  outcomes: [
    "Write a product vision statement and a strategy that names target customers, the problem, and the differentiator.",
    "Assess product–market fit using retention and customer-sentiment signals.",
    "Choose a North Star metric and supporting input metrics for a product.",
    "Prioritise a backlog using RICE and explain the limits of scoring models.",
    "Build a Now–Next–Later roadmap and justify trade-offs to stakeholders.",
    "Evaluate a build, buy, or partner decision."
  ],
  concepts: ["Vision", "Strategy", "Product–market fit", "North Star metric", "OKRs", "RICE", "MoSCoW", "Kano", "Roadmap"],
  topics: [
    { h: "Vision, mission, and strategy", body: "A product vision describes the future you want to create for customers, usually three to five years out. Strategy is the set of choices about how to get there: which customers to serve first, which problems to solve, and how to win against alternatives. A good strategy says what you will not do.", points: ["Vision: inspiring and customer-centred.", "Strategy: target segment, key problem, differentiator, and the bets you are making.", "Roadmaps and backlogs should trace back to the strategy."] },
    { h: "Product–market fit", body: "Marc Andreessen described product–market fit as being in a good market with a product that can satisfy that market. In practice, PMs look for signals: retention curves that flatten rather than fall to zero, strong organic referrals, and customers who would be very disappointed without the product. Sean Ellis popularised a survey benchmark: if around 40% or more of users say they would be 'very disappointed', fit is likely.", points: ["Flattening retention is the most reliable signal.", "Fit is specific to a segment; you can have fit with one group and not another."] },
    { h: "North Star and input metrics", body: "A North Star metric captures the core value customers get, and predicts long-term business success. Input metrics are the levers teams can move that drive it. For a music app the North Star might be time spent listening; inputs could include new users activated, playlists created, and recommendations played.", points: ["A good North Star reflects customer value, not just revenue.", "Avoid vanity metrics such as total downloads."] },
    { h: "OKRs", body: "Objectives and Key Results (OKRs) pair a qualitative objective with three to five measurable key results. Objectives say where you want to go; key results say how you will know you got there. Product teams should set outcome-based key results rather than lists of features.", points: ["Objective: Make reordering effortless for repeat customers.", "KR: Raise the 30-day repeat-order rate from 22% to 30% (illustrative)."] },
    { h: "Prioritisation frameworks", body: "RICE (popularised by Intercom) scores each idea as Reach × Impact × Confidence ÷ Effort. MoSCoW sorts scope into Must, Should, Could, and Won't. The Kano model (Noriaki Kano) separates basic expectations, performance features, and delighters. Value-versus-effort plots ideas on a 2×2 to find quick wins. Cost of delay asks what it costs to wait.", points: ["Frameworks structure debate; they do not replace judgement.", "Be explicit about where the numbers come from, especially Confidence."] },
    { h: "Roadmaps", body: "A roadmap communicates direction and priorities over time. Feature-based roadmaps with fixed dates create false certainty. Outcome-based roadmaps, often in a Now–Next–Later format, show the problems the team will tackle and the outcomes it expects, with detail decreasing further out.", points: ["Now: committed and well understood.", "Next: likely, being explored.", "Later: directional, open to change."] },
    { h: "Stakeholders, trade-offs, and build–buy–partner", body: "PMs balance requests from sales, leadership, support, and partners. Saying no is easier when priorities are tied to a shared strategy and evidence. For capabilities outside the core, PMs weigh building in-house, buying a tool or company, or partnering, considering speed, cost, control, and strategic importance.", points: ["Build what differentiates you; buy or partner for commodities.", "Use a stakeholder map (influence vs interest) to plan communication."] }
  ],
  example: { title: "Industry application: choosing a North Star", body: "Consider a food-delivery app. 'Number of app downloads' is a vanity metric. A stronger North Star is 'orders delivered on time to repeat customers per week', because it reflects customer value (getting food reliably) and predicts revenue. Input metrics could include restaurant coverage, delivery-time accuracy, and reorder rate. (Illustrative example.)" },
  miniCase: { title: "Mini-case: the loud customer", context: "Your largest enterprise client threatens to leave unless you build a custom reporting feature. Your roadmap focuses on improving onboarding, which data shows is the main reason small customers churn.", question: "How would you decide? Which framework would you use, and how would you explain the decision to the sales head and the client?" },
  activity: { title: "Activity: prioritise and roadmap", steps: ["Open the RICE calculator in the Product Toolkit and load the sample backlog.", "Adjust the scores using your own assumptions and note why.", "Compare the top three with what MoSCoW would give you.", "Place the items on a Now–Next–Later roadmap.", "Write a 100-word note defending one item you chose not to build."], deliverable: "A prioritised backlog, roadmap, and trade-off note." },
  check: [
    { q: "A feature has Reach 2,000, Impact 2, Confidence 80%, and Effort 4 person-months. What is its RICE score?", o: ["400", "800", "1,600", "3,200"], a: 1, why: "2,000 × 2 × 0.8 ÷ 4 = 800." },
    { q: "Which is the strongest signal of product–market fit?", o: ["A spike in downloads after an ad campaign", "A retention curve that flattens over time", "Positive comments from investors", "A long feature list"], a: 1, why: "Flattening retention shows a group of users keeps getting value." },

    { h: "MVP and MLP", body: "A minimum viable product is the smallest version that lets you learn whether you are solving the right problem. It is a learning tool, not a low-quality product. A minimum lovable product (MLP) sets the bar higher: the smallest version customers would genuinely enjoy and recommend. Iterative releases then add value in small steps.", points: ["Cut scope, not quality.", "Each release should test a clear hypothesis."] },

  activity: { title: "Activity: write a mini-PRD", steps: ["Choose one feature from your Module 3 roadmap.", "Write the problem, goal, and success metric.", "List scope and two explicit non-goals.", "Write five user stories with acceptance criteria.", "Sketch two low-fidelity wireframes."], deliverable: "A one-page PRD with stories and wireframes." },

    { h: "Go-to-market and launch planning", body: "A go-to-market (GTM) strategy defines the target segment, value proposition, positioning, pricing, channels, and launch sequence. A launch plan turns this into tasks: readiness of support and sales, documentation, communication, a rollout plan, and the metrics to watch in the first days and weeks.", points: ["Launch tiers: not every feature needs a big launch.", "Agree success metrics and a rollback plan before launch day."] },

    { h: "The AARRR funnel", body: "Dave McClure's AARRR ('pirate metrics') framework tracks Acquisition (users arrive), Activation (they experience core value), Retention (they come back), Referral (they bring others), and Revenue (they pay). It helps find the biggest leak: there is little point buying more traffic if new users never activate.", points: ["Define activation as the moment users first get real value.", "Fix the leakiest stage first."] },
    { h: "Product analytics", body: "Key measures include activation rate (activated users ÷ new sign-ups), retention (users still active after a period), churn (customers lost in a period), and stickiness (DAU ÷ MAU). Cohort analysis groups users by sign-up period and tracks them over time, separating real improvement from growth that hides poor retention.", points: ["Example: 250 of 1,000 week-0 sign-ups active in week 4 = 25% week-4 retention.", "DAU 30,000 ÷ MAU 1,20,000 = 25% stickiness (illustrative)."] },

    { h: "Product-led growth, onboarding, and the later life cycle", body: "In product-led growth (PLG), the product itself drives acquisition and expansion through free trials, freemium, and built-in sharing. Onboarding gets users to value quickly. Growth loops reuse output from one user to attract the next. As products mature, PMs also decide when to sunset features that cost more to maintain than the value they deliver.", points: ["Shorten time-to-value in onboarding.", "Sunset with notice, migration help, and clear communication."] },
    { h: "Responsible product management", body: "Dark patterns are designs that trick users, such as hidden costs, hard-to-cancel subscriptions, or pre-ticked consent boxes. They may lift short-term metrics but damage trust and can breach consumer-protection and data-protection rules. Responsible PMs design for informed consent, data minimisation, accessibility, and digital inclusion across languages and connectivity levels.", points: ["India has issued guidelines against dark patterns on online platforms; check current regulations for your market.", "Ask: would we be comfortable if users saw exactly how this works?"] }

  activity: { title: "Activity: launch and measure", steps: ["Pick a feature from your PRD in Module 4.", "Write a one-paragraph GTM summary: segment, value, channel.", "Define the AARRR metric that matters most for this feature.", "Design one A/B test using the template.", "List three launch-readiness checks and one rollback trigger."], deliverable: "A launch plan and a metrics dashboard outline." },

  ],
  glossary: ["Go-to-market", "Freemium", "Product-led growth", "AARRR", "Activation", "Retention", "Churn", "Cohort analysis", "DAU / MAU", "A/B test", "Statistical significance", "Guardrail metric", "Dark pattern"],

    { k: "table", t: "Pricing models", h: ["Model", "Works well when", "Risk"], rows: [["Subscription", "Ongoing value", "Churn"], ["Freemium", "Free tier creates value and upgrade reasons", "Too few convert"], ["Tiered", "Segments value features differently", "Complex choice"], ["Usage-based", "Value scales with use", "Unpredictable bills"]], n: "" },

// Glossary: [term, definition, example, module]
const GLOSSARY = [
  ["Product", "Anything offered to customers that solves a problem repeatedly over time and keeps evolving.", "A payments app, a SaaS tool, or a packaged snack brand.", 1],
  ["Product manager", "The person accountable for the value a product creates for customers and the business, leading through clarity rather than authority.", "A PM decides which checkout problem the team tackles this quarter and why.", 1],
  ["Project management", "Planning and coordinating work with a fixed scope, budget, and end date.", "Running the two-month project to integrate a new payment gateway.", 1],
  ["Product thinking", "Starting from a customer problem and a desired outcome before choosing solutions.", "Asking 'why do users abandon checkout?' before agreeing to build a chatbot.", 1],
  ["Outcome vs output", "An output is what a team ships; an outcome is the change in user behaviour or results it causes.", "Output: a new filter. Outcome: users find items twice as fast.", 1],
  ["Cross-functional team", "A team combining product, design, engineering, and often data, marketing, and operations.", "The 'product trio' of PM, designer, and tech lead running discovery together.", 1],
  ["Stakeholder", "Anyone with an interest in or influence over the product, inside or outside the company.", "Sales head, legal team, key enterprise clients, and the CEO.", 1],
  ["Four product risks", "Marty Cagan's value, usability, feasibility, and viability risks that teams should test early.", "Testing with a prototype whether users understand a new pricing screen (usability).", 1],
  ["Product life cycle", "The stages a product moves through: introduction, growth, maturity, and decline.", "A mature messaging app focuses on retention and new segments.", 1],
  ["Product owner", "In Scrum, the role accountable for the product backlog; often held by the PM.", "The product owner orders the backlog before sprint planning.", 1],
  ["Problem statement", "A short description of who struggles with what, in which situation, and with what evidence, without naming a solution.", "First-time buyers abandon checkout when delivery dates are unclear.", 2],
  ["Jobs-to-be-Done", "A framework that sees customers 'hiring' products to make progress in a specific situation.", "When I'm commuting, I want quick learning so I feel I'm progressing.", 2],
  ["Persona", "A research-based archetype of a user with goals, behaviours, and pain points.", "'Ravi, 34, kirana owner who restocks twice a week and prefers Hindi.'", 2],
  ["Empathy map", "A grid capturing what a user says, thinks, does, and feels.", "Used after interviews to spot gaps between what users say and do.", 2],
  ["Customer journey map", "A visual of the stages a customer goes through, with pains and emotions at each stage.", "Aware → consider → sign up → use → return, with the biggest pain at sign-up.", 2],
  ["Opportunity solution tree", "Teresa Torres's diagram linking an outcome to customer opportunities, solutions, and experiments.", "Outcome: more repeat orders → opportunity: hard to reorder → solution: one-tap reorder.", 2],
  ["User research", "Methods for understanding users, such as interviews, surveys, observation, and usability tests.", "Five interviews with recent drop-offs before redesigning onboarding.", 2],
  ["Usability testing", "Watching real users attempt tasks with a design to find friction.", "Asking five users to book an appointment on a prototype.", 2],
  ["TAM / SAM / SOM", "Total, serviceable available, and serviceable obtainable market: the category, the part you can reach, and the share you can win soon.", "Bottom-up: 2,00,000 stores × ₹6,000/year = ₹120 crore SAM (illustrative).", 2],
  ["Competitive analysis", "Comparing alternatives, including indirect substitutes, on the jobs customers care about.", "A learning app compares itself with tutors, YouTube, and books.", 2],
  ["Value proposition", "A clear statement of the benefit a product delivers to a specific customer and why it beats alternatives.", "Groceries from your trusted local store, delivered in 30 minutes.", 2],
  ["Fake-door test", "Showing an option for a feature that does not exist yet to measure interest.", "A 'Pay later' button that explains the feature is coming and records clicks.", 2],
  ["Concierge MVP", "Delivering a service manually to a few customers to test its value before automating.", "A founder personally curates weekly meal plans for 20 users.", 2],
  ["Wizard-of-Oz MVP", "A product that looks automated to users but is run by people behind the scenes.", "'AI' travel recommendations actually written by staff during the test.", 2],
  ["Product vision", "A description of the future the product aims to create for customers, typically 3–5 years out.", "Every neighbourhood store can sell online as easily as in person.", 3],
  ["Product strategy", "The choices about which customers, problems, and advantages the product will focus on to reach the vision.", "Start with grocery stores in tier-2 cities, win on regional-language support.", 3],
  ["Product–market fit", "Being in a good market with a product that satisfies it; signalled by retention that flattens and strong pull from users.", "Retention stabilises at 35% after month 3 for a core segment.", 3],
  ["North Star metric", "The single metric that best captures the value customers get and predicts long-term success.", "Orders delivered on time to repeat customers per week.", 3],
  ["Input metric", "A metric teams can directly influence that drives the North Star.", "Delivery-time accuracy or restaurant coverage.", 3],
  ["Vanity metric", "A number that looks impressive but does not reflect real value or guide decisions.", "Total app downloads since launch.", 3],
  ["OKR", "Objectives and Key Results: a qualitative objective with 3–5 measurable results.", "O: Make reordering effortless. KR: repeat-order rate from 22% to 30%.", 3],
  ["Prioritisation", "Deciding the order in which to tackle problems and features given limited capacity.", "Choosing onboarding fixes over a custom report for one client.", 3],

function riceScore(r) {
  const reach = +r.reach, imp = +r.impact, conf = +r.conf, eff = +r.effort;
  if (!(eff > 0) || !(reach >= 0) || !(conf >= 0) || conf > 100 || !(imp > 0)) return null;
  return reach * imp * (conf / 100) / eff;
}
function riceRows() {
  return S.rice.map((r, i) => ({ r, i, s: riceScore(r) })).sort((a, b) => (b.s ?? -1) - (a.s ?? -1));
}
function riceBody() {
  const rows = riceRows();
  if (!rows.length) return `<tr><td colspan="8"><div class="empty">No features yet. Add one, or load the sample backlog.</div></td></tr>`;
  return rows.map((x, k) => `<tr class="${k < 3 && x.s != null ? "top" : ""}" data-row="${x.i}">
    <td class="rank">${x.s != null ? "#" + (k + 1) : "–"}</td>
    <td><input type="text" id="rn-${x.i}" aria-label="Feature name" data-f="name" value="${esc(x.r.name)}"></td>
    <td><input type="number" id="rr-${x.i}" aria-label="Reach" data-f="reach" min="0" step="100" value="${esc(x.r.reach)}"></td>
    <td><select id="ri-${x.i}" aria-label="Impact" data-f="impact">${[0.25, 0.5, 1, 2, 3].map(v => `<option value="${v}" ${+x.r.impact === v ? "selected" : ""}>${v}</option>`).join("")}</select></td>
    <td><input type="number" id="rc-${x.i}" aria-label="Confidence percent" data-f="conf" min="0" max="100" step="10" value="${esc(x.r.conf)}"></td>
    <td><input type="number" id="re-${x.i}" aria-label="Effort in person-months" data-f="effort" min="0" step="0.5" value="${esc(x.r.effort)}"></td>
    <td class="num rice-score">${x.s != null ? inr(x.s) : `<span class="err">Check inputs</span>`}</td>
    <td><button class="btn ghost small" data-act="rice-del" data-i="${x.i}" aria-label="Delete ${esc(x.r.name)}">Delete</button></td></tr>`).join("");
}

function pageToolkit() {

    <div class="table-wrap"><table class="rice-table"><thead><tr><th>Rank</th><th>Feature</th><th>Reach <span class="note">(users/qtr)</span></th><th>Impact</th><th>Confidence %</th><th>Effort <span class="note">(person-months)</span></th><th class="num">RICE score</th><th></th></tr></thead><tbody id="riceBody">${riceBody()}</tbody></table></div>
    <div class="btn-row"><button class="btn" data-act="rice-add">Add feature</button><button class="btn ghost" data-act="rice-sort">Re-sort by score</button><button class="btn ghost" data-act="rice-sample">Load sample backlog</button><button class="btn ghost" data-act="rice-reset">Clear all</button></div>

function glossList() {
  const q = S.gq.trim().toLowerCase();
  let list = GLOSSARY.filter(g => (!S.gm || g[3] === S.gm) && (!q || g[0].toLowerCase().includes(q) || g[1].toLowerCase().includes(q)) && (!S.gl || g[0][0].toUpperCase() === S.gl));
  list = list.slice().sort((a, b) => S.gsort === "mod" ? (a[3] - b[3] || a[0].localeCompare(b[0])) : a[0].localeCompare(b[0]));
  if (!list.length) return `<div class="empty">No terms match${q ? ` “${esc(S.gq)}”` : ""}. Try a shorter word or clear the filters.</div>`;
  return `<p class="note">${list.length} term${list.length === 1 ? "" : "s"}</p><div class="grid-2">${list.map(g => `<article class="panel term" id="term-${slug(g[0])}"><div class="btn-row" style="justify-content:space-between"><h3>${esc(g[0])}</h3><a class="tag" href="#m${g[3]}">Module ${g[3]}</a></div><p>${esc(g[1])}</p><p class="ex"><b>Example:</b> ${esc(g[2])}</p></article>`).join("")}</div>`;
}

  <div class="bar"><i style="width:${Math.round(answered / QUIZ.length * 100)}%"></i></div>
  <div class="dots" aria-label="Jump to question">${QUIZ.map((_, i) => `<button data-act="q-go" data-i="${i}" class="${i === z.i ? "cur" : ""} ${z.sub[i] ? "ans" : ""}" aria-label="Question ${i + 1}${z.sub[i] ? ", answered" : ""}">${i + 1}</button>`).join("")}</div>
  <div class="q"><h2 style="font-size:1.35rem">${esc(q.q)}</h2><div class="opts" role="radiogroup">${q.o.map((o, oi) => {
    const cls = sub ? (oi === q.a ? "right" : (oi === sel ? "wrong" : "")) : (oi === sel ? "sel" : "");
    return `<button class="opt ${cls}" role="radio" aria-checked="${oi === sel}" data-act="q-pick" data-o="${oi}" ${sub ? "disabled" : ""}><span class="key">${"ABCD"[oi]}</span><span>${esc(o)}</span></button>`;
  }).join("")}</div>
  ${sub ? `<div class="feedback ${sel === q.a ? "ok" : "no"}"><b>${sel === q.a ? "Correct." : "Not quite. The answer is " + "ABCD"[q.a] + "."}</b><span>${esc(q.e)}</span></div>` : ""}</div>
  <div class="btn-row" style="justify-content:space-between"><button class="btn ghost" data-act="q-prev" ${z.i === 0 ? "disabled" : ""}>← Previous</button>
  <div class="btn-row">${sub ? "" : `<button class="btn teal" data-act="q-submit" ${sel == null ? "disabled" : ""}>Submit answer</button>`}
  ${z.i < QUIZ.length - 1 ? `<button class="btn ${sub ? "" : "ghost"}" data-act="q-next">Next →</button>` : ""}
  ${answered === QUIZ.length ? `<button class="btn" data-act="q-finish">See results</button>` : (z.i === QUIZ.length - 1 ? `<button class="btn ghost" data-act="q-finish">Finish now (${QUIZ.length - answered} unanswered)</button>` : "")}</div></div>
  </section></div>`;
}
function quizResults() {
  const z = S.quiz, right = QUIZ.filter((q, i) => z.sub[i] && z.sel[i] === q.a).length, pct = Math.round(right / QUIZ.length * 100);
  const band = pct >= 80 ? "Excellent. You're making strong product calls. Try explaining your reasoning to a classmate." : pct >= 60 ? "Good work. Review the explanations for the questions you missed, then revisit those modules." : "A solid start. Revisit the modules with the lowest scores below and retake the quiz.";
  return `<div class="page"><section class="section"><span class="eyebrow">Quiz results</span><h1>Your score</h1></section>
  <section class="panel section"><div class="btn-row" style="gap:24px"><div class="score-big">${right}/${QUIZ.length}</div><div><b style="font-size:1.4rem;font-family:var(--f-display)">${pct}%</b><p>${band}</p></div></div>
  <div class="table-wrap"><table><thead><tr><th>Module</th><th class="num">Correct</th><th>Score</th></tr></thead><tbody>${MODULES.map(m => {
    const idx = QUIZ.map((q, i) => q.m === m.id ? i : -1).filter(i => i >= 0), c = idx.filter(i => z.sub[i] && z.sel[i] === QUIZ[i].a).length;
    return `<tr><td><a href="#m${m.id}">${m.id}. ${esc(m.title)}</a></td><td class="num">${c} / ${idx.length}</td><td style="min-width:140px"><div class="bar"><i style="width:${c / idx.length * 100}%"></i></div></td></tr>`;
  }).join("")}</tbody></table></div>
  <div class="btn-row"><button class="btn" data-act="q-retake">Retake quiz</button><a class="btn ghost" href="#review">Review answers</a></div></section>
  <section class="section" id="review"><h2>Review answers</h2>${QUIZ.map((q, i) => {
    const ok = z.sub[i] && z.sel[i] === q.a;
    return `<div class="panel q"><div class="btn-row" style="justify-content:space-between"><span class="tag">Q${i + 1} · Module ${q.m}</span><span class="chip ${ok ? "" : "orange"}">${ok ? "Correct" : (z.sub[i] ? "Incorrect" : "Not answered")}</span></div><p><b>${esc(q.q)}</b></p>
    <p>Your answer: ${z.sel[i] != null && z.sub[i] ? esc("ABCD"[z.sel[i]] + ". " + q.o[z.sel[i]]) : "—"}<br>Correct answer: <b>${esc("ABCD"[q.a] + ". " + q.o[q.a])}</b></p><p class="note">${esc(q.e)}</p></div>`;
  }).join("")}</section></div>`;
}

function pageCases() {
  const list = CASES.filter(c => !S.caseM || c.m === S.caseM);
  return `<div class="page"><section class="section"><span class="eyebrow">Case studies</span><h1>Classroom cases</h1><p class="lede">Short scenarios for discussion. Companies and figures are illustrative and fictional, written to reflect common situations in Indian and global product teams.</p>
  <div class="chips"><button class="chip ${S.caseM ? "plain" : ""}" data-act="case-m" data-m="0">All</button>${[2, 3, 4, 5].map(m => `<button class="chip ${S.caseM === m ? "" : "plain"}" data-act="case-m" data-m="${m}">Module ${m}</button>`).join("")}</div></section>
  ${list.map(c => `<article class="panel section"><div class="btn-row" style="justify-content:space-between"><span class="tag">${esc(c.tag)}</span><span class="chip orange">Illustrative</span></div><h2>${esc(c.title)}</h2>
  <div class="grid-2"><div class="section"><h3>Business context</h3><p>${esc(c.context)}</p><h3>The problem</h3><p>${esc(c.problem)}</p></div>
  <div class="section"><h3>What we know</h3><ul class="ticks">${c.info.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>
  <div class="grid-2"><div class="section"><h3>Discussion questions</h3><ol class="steps">${c.questions.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>
  <div class="callout"><span class="eyebrow">Suggested framework</span><p>${esc(c.framework)}</p><a href="#m${c.m}">Go to Module ${c.m}</a></div></div></article>`).join("")}</div>`;
}

// ---------- router ----------
const PAGES = { home: pageHome, syllabus: pageSyllabus, modules: pageModules, presentations: pagePresentations, toolkit: pageToolkit, glossary: pageGlossary, quiz: pageQuiz, cases: pageCases };
function parseRoute() {
  const h = (location.hash || "#home").slice(1);
  if (/^m[1-5]$/.test(h)) return { page: "module", id: +h[1] };
  if (/^slides-[1-5]$/.test(h)) return { page: "module", id: +h.slice(-1), anchor: h };
  if (h === "review") return { page: "quiz", anchor: "review" };
  if (h === "kc") return null;
  return { page: PAGES[h] ? h : "home" };
}
function render(scrollTop) {
  const r = parseRoute(); if (!r) return;
  S.route = r.page === "module" ? "m" + r.id : r.page;
  const view = $("#view");
  view.innerHTML = r.page === "module" ? pageModule(r.id) : PAGES[r.page]();
  document.querySelectorAll(".nav a").forEach(a => {
    const on = a.dataset.r === r.page || (r.page === "module" && a.dataset.r === "modules");
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  $("#nav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
  if (r.anchor) { const el = document.getElementById(r.anchor); if (el) el.scrollIntoView(); }
  else if (S.gfocus && r.page === "glossary") { const el = document.getElementById("term-" + slug(S.gfocus)); S.gfocus = null; if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); } }
  else if (S.openTpl && r.page === "toolkit") { const el = document.getElementById("tpl-" + S.openTpl); if (el) el.scrollIntoView(); }
  else if (scrollTop !== false) window.scrollTo(0, 0);
}
function rerender() { const y = window.scrollY; render(false); window.scrollTo(0, y); }
window.addEventListener("hashchange", () => { S.openTpl = null; render(); });

// ---------- events ----------
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, m = +b.dataset.m;
  switch (act) {
    case "challenge": S.challenge = !S.challenge; rerender(); break;
    case "download": downloadDeck(m, b.parentElement.querySelector(".dl-status")); break;
    case "prev-slide": S.slide[m] = Math.max(0, (S.slide[m] || 0) - 1); rerenderViewer(m); break;
    case "next-slide": S.slide[m] = Math.min(modById(m).slides.length - 1, (S.slide[m] || 0) + 1); rerenderViewer(m); break;
    case "toggle-notes": S.notes = b.checked; rerenderViewer(+b.closest("[data-viewer]").dataset.viewer); break;
    case "view-deck": S.deck = m; rerender(); { const el = $("#deckview"); if (el) el.scrollIntoView({ behavior: "smooth" }); } break;
    case "goto-slides": e.preventDefault(); { const el = document.getElementById("slides-" + m); if (el) el.scrollIntoView({ behavior: "smooth" }); } break;
    case "toggle-done": if (S.done.has(m)) S.done.delete(m); else S.done.add(m); store.set("done", [...S.done]); rerender(); break;
    case "term": S.gq = ""; S.gm = 0; S.gl = ""; S.gfocus = b.dataset.term; location.hash = "#glossary"; break;
    case "tpl": S.openTpl = b.dataset.t; if (location.hash === "#toolkit") rerender(); else { location.hash = "#toolkit"; setTimeout(() => { S.openTpl = b.dataset.t; render(false); }, 0); } break;
    case "kc-pick": S.kc[m][+b.dataset.q].sel = +b.dataset.o; rerender(); break;
    case "kc-check": S.kc[m][+b.dataset.q].sub = true; rerender(); break;
    case "kc-reset": delete S.kc[m]; rerender(); break;
    case "q-pick": S.quiz.sel[S.quiz.i] = +b.dataset.o; rerender(); break;
    case "q-submit": S.quiz.sub[S.quiz.i] = true; rerender(); break;
    case "q-next": S.quiz.i++; rerender(); break;
    case "q-prev": S.quiz.i--; rerender(); break;
    case "q-go": S.quiz.i = +b.dataset.i; rerender(); break;
    case "q-finish": {
      S.quiz.finished = true;
      const right = QUIZ.filter((q, i) => S.quiz.sub[i] && S.quiz.sel[i] === q.a).length;
      if (S.best == null || right > S.best) { S.best = right; store.set("best", right); }
      render(); break;
    }
    case "q-retake": S.quiz = freshQuiz(); render(); break;
    case "copy": { const t = tplById(b.dataset.t); copyText(b.dataset.w === "ex" ? t.ex : t.t, b); break; }
    case "rice-add": S.rice.push({ name: "New feature", reach: 1000, impact: 1, conf: 80, effort: 1 }); saveRice(); $("#riceBody").innerHTML = riceBody(); { const el = document.getElementById("rn-" + (S.rice.length - 1)); if (el) { el.focus(); el.select(); } } break;
    case "rice-del": S.rice.splice(+b.dataset.i, 1); saveRice(); $("#riceBody").innerHTML = riceBody(); break;
    case "rice-sort": $("#riceBody").innerHTML = riceBody(); break;
    case "rice-sample": S.rice = sampleRice(); saveRice(); $("#riceBody").innerHTML = riceBody(); break;
    case "rice-reset": S.rice = []; saveRice(); $("#riceBody").innerHTML = riceBody(); break;
    case "g-letter": S.gl = S.gl === b.dataset.l ? "" : b.dataset.l; document.querySelectorAll(".az button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.l === S.gl))); $("#glist").innerHTML = glossList(); break;
    case "g-clear": S.gq = ""; S.gm = 0; S.gl = ""; S.gsort = "az"; rerender(); break;
    case "case-m": S.caseM = m; rerender(); break;
  }
});
function rerenderViewer(m) {
  const v = document.querySelector(`[data-viewer="${m}"]`); if (!v) return;
  v.outerHTML = viewerHTML(modById(m));
}
function saveRice() { store.set("rice", S.rice); }

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "gq") { S.gq = t.value; $("#glist").innerHTML = glossList(); }
  const tr = t.closest && t.closest("tr[data-row]");
  if (tr && t.dataset.f) {
    const i = +tr.dataset.row; S.rice[i][t.dataset.f] = t.dataset.f === "name" ? t.value : t.value;
    saveRice();
    const s = riceScore(S.rice[i]);
    tr.querySelector(".rice-score").innerHTML = s != null ? inr(s) : `<span class="err">Check inputs</span>`;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "gm") { S.gm = +t.value; $("#glist").innerHTML = glossList(); }
  if (t.id === "gs") { S.gsort = t.value; $("#glist").innerHTML = glossList(); }
  if (t.closest && t.closest("tr[data-row]") && t.dataset.f && t.dataset.f !== "name") { $("#riceBody").innerHTML = riceBody(); }
});
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea, select")) return;
  const v = document.querySelector("[data-viewer]"); if (!v) return;
  const m = +v.dataset.viewer;
  if (e.key === "ArrowRight" && v.matches(":hover, :focus-within")) { S.slide[m] = Math.min(modById(m).slides.length - 1, (S.slide[m] || 0) + 1); rerenderViewer(m); }
  if (e.key === "ArrowLeft" && v.matches(":hover, :focus-within")) { S.slide[m] = Math.max(0, (S.slide[m] || 0) - 1); rerenderViewer(m); }
});
$("#menuBtn").addEventListener("click", () => { const n = $("#nav"); n.classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(n.classList.contains("open"))); });

render();
})();

</script>
</body>
</html>
