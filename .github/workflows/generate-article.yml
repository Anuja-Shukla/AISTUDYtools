name: Auto-Generate Newsletter Article

# Writes a new newsletter issue into site-src/newsletter/ (at most every 2 days),
# then rebuilds the site so the issue appears on /newsletter/.
# Needs the GEMINI_API_KEY repository secret.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests markdown
      - name: Generate article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_article.py
      - name: Rebuild site
        run: |
          python site-src/build.py
          cp -r site-src/out/. .
          rm -rf site-src/out
          mkdir -p static
          cp site-src/site.css site-src/site.js site-src/tool-chrome.css static/
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new article generated."
          else
            git commit -m "Auto-generate newsletter article"
            git push
          fi
