name: Update contact email
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -l "webinars@aistudytools.com" assets/*.js || true
          sed -i 's/webinars@aistudytools\.com/intelliqueresearchschool@gmail.com/g' assets/*.js
          ! grep -q "webinars@aistudytools.com" assets/*.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use intelliqueresearchschool@gmail.com as contact email" || echo "nothing to change"
          git push
